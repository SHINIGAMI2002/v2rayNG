name: Build Manga APK

# Run manually from the Actions tab, or on every push to master.
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Submodules are REQUIRED. Without --recursive you get empty
      # AndroidLibXrayLite/ and hev-socks5-tunnel/ folders and the build fails.
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      # NDK is needed to compile hev-socks5-tunnel (the tun2socks layer).
      # This is the piece that cannot be downloaded prebuilt.
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # Cache the native libs — this step takes ~10 min on a cold run.
      - name: Restore cached libhevtun
        id: cache-hevtun
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun (tun2socks)
        if: steps.cache-hevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-hevtun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy native libs into app
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      # The Xray core AAR is a prebuilt release artifact — no Go toolchain needed.
      - name: Read AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          echo "CURRENT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          popd

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.9
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      # Debug build — self-signed, no keystore secrets needed.
      # Perfect for personal sideloading.
      - name: Build debug APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manga-vpn-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/debug/*.apk
          retention-days: 30

      # Helps a lot when the first run fails.
      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/V2rayNG/app/build/reports/
            ${{ github.workspace }}/V2rayNG/build/
          retention-days: 7
